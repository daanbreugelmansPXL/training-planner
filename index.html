<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Personal training planner and workout logbook for Muay Thai & Strength">
  <meta name="theme-color" content="#0A0A0B">

  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Training">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">

  <!-- Manifest & Icons -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">

  <title>Training</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="theme-auto">
  <div id="app" class="app-container">
    
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-inner">
        <div class="brand-title">
          <span class="brand-accent-dot"></span>
          <span>Training</span>
        </div>

        <!-- Desktop Navigation Tabs -->
        <nav class="header-nav" aria-label="Desktop Navigation">
          <button id="desk-tab-plan" class="nav-link active" data-tab="plan">Plan</button>
          <button id="desk-tab-templates" class="nav-link" data-tab="templates">Templates</button>
          <button id="desk-tab-progress" class="nav-link" data-tab="progress">Progress</button>
        </nav>

        <div class="header-actions">
          <button id="btn-open-settings" class="btn-icon" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Viewport Scroll Area -->
    <main class="main-viewport" id="main-scroll-viewport">
      
      <!-- TAB 1: PLAN -->
      <section id="view-plan" class="view-pane active">
        <!-- Self-contained Day Strip Wrapper -->
        <div class="day-strip-wrapper">
          <div class="day-strip-inner">
            <div class="week-meta-bar">
              <div class="week-nav-controls">
                <button id="btn-prev-week" class="btn-week-step" aria-label="Previous week">‹</button>
                <span id="label-week-current" class="week-label" title="Jump to current week">Week --</span>
                <button id="btn-next-week" class="btn-week-step" aria-label="Next week">›</button>
              </div>
              <div class="week-variant-selector" role="radiogroup" aria-label="Plan Variant">
                <button id="btn-variant-3day" class="btn-plan-toggle active" role="radio" aria-checked="true">3-Day</button>
                <button id="btn-variant-2day" class="btn-plan-toggle" role="radio" aria-checked="false">2-Day</button>
              </div>
            </div>

            <!-- Horizontally scrollable strip (scrolls only itself) -->
            <div id="day-strip-container" class="day-strip" role="tablist" aria-label="Days of week">
              <!-- Dynamically populated 7 days -->
            </div>
          </div>
        </div>

        <div class="view-content">
          <!-- Session Container -->
          <div id="session-container">
            <!-- Dynamically rendered session -->
          </div>
        </div>
      </section>

      <!-- TAB 2: TEMPLATES -->
      <section id="view-templates" class="view-pane">
        <div class="view-content">
          <!-- Templates Index List -->
          <div id="templates-index-view">
            <h2 class="session-title" style="font-size: 1.25rem;">Templates</h2>
            <div id="templates-list-container" class="templates-list">
              <!-- Dynamically populated template rows -->
            </div>
          </div>

          <!-- Template Editor Sub-view -->
          <div id="template-editor-view" class="template-editor-view">
            <div class="editor-header-bar">
              <button id="btn-back-to-templates" class="btn-action-text">‹ Back</button>
              <h2 id="editor-template-title" class="editor-title">Strength A</h2>
              <span id="editor-save-indicator" class="editor-autosave-indicator">✓</span>
            </div>

            <!-- Warm-up Section -->
            <div class="editor-section">
              <div class="editor-section-title">Warm-up</div>
              <div id="editor-warmup-container" class="editor-rows-container"></div>
              <div class="quick-add-wrap">
                <input type="text" id="quick-add-warmup" class="input-quick-add" placeholder="Add warm-up drill...">
              </div>
            </div>

            <!-- Main Exercises Section -->
            <div class="editor-section">
              <div class="editor-section-title">Main Exercises</div>
              <div id="editor-main-container" class="editor-rows-container"></div>
              <div class="quick-add-wrap">
                <input type="text" id="quick-add-main" class="input-quick-add" placeholder="Add exercise (e.g. Bench press 3x6-10 2min)...">
              </div>
            </div>

            <!-- Cooldown Section -->
            <div class="editor-section">
              <div class="editor-section-title">Cooldown</div>
              <div id="editor-cooldown-container" class="editor-rows-container"></div>
              <div class="quick-add-wrap">
                <input type="text" id="quick-add-cooldown" class="input-quick-add" placeholder="Add cooldown stretch...">
              </div>
            </div>

            <!-- Reset Template Button -->
            <div style="margin-top: var(--space-4); display: flex; justify-content: flex-end;">
              <button id="btn-reset-template" class="btn-action-text" style="color: var(--accent);">Reset to default</button>
            </div>
          </div>
        </div>
      </section>

      <!-- TAB 3: PROGRESS -->
      <section id="view-progress" class="view-pane">
        <div class="view-content">
          <div class="progress-quiet-row">
            <span id="progress-streak-label">Streak: 0 wks</span>
            <span id="progress-total-label">Done: 0 sessions</span>
          </div>

          <div id="progress-exercise-list" class="progress-exercise-list">
            <!-- Dynamically populated exercise rows with SVG chart dropdown -->
          </div>
        </div>
      </section>

    </main>

    <!-- Rest Timer (Docked compact hairline bar above bottom nav) -->
    <div id="docked-rest-timer" class="rest-timer-docked" role="region" aria-label="Rest Timer">
      <div class="rest-timer-inner">
        <span id="timer-digits" class="timer-countdown">02:00</span>
        <div class="timer-controls-group">
          <button id="btn-timer-sub15" class="btn-timer-action">-15s</button>
          <button id="btn-timer-toggle" class="btn-timer-action">Pause</button>
          <button id="btn-timer-add15" class="btn-timer-action">+15s</button>
          <button id="btn-timer-skip" class="btn-timer-action" style="color: var(--text);">Skip</button>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation Bar (Phone) -->
    <nav class="bottom-tab-bar" aria-label="Mobile Navigation">
      <button id="tab-btn-plan" class="tab-btn active" data-tab="plan">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Plan</span>
      </button>
      <button id="tab-btn-templates" class="tab-btn" data-tab="templates">
        <svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
        <span>Templates</span>
      </button>
      <button id="tab-btn-progress" class="tab-btn" data-tab="progress">
        <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span>Progress</span>
      </button>
    </nav>

    <!-- Reschedule Bottom Sheet -->
    <div id="sheet-reschedule" class="bottom-sheet-overlay" role="dialog" aria-modal="true" aria-labelledby="reschedule-title">
      <div class="bottom-sheet">
        <div class="sheet-header">
          <h3 id="reschedule-title" class="sheet-title">Move Session</h3>
          <button id="btn-close-reschedule" class="btn-action-text">✕</button>
        </div>
        <div id="reschedule-days-list" class="reschedule-days-list">
          <!-- 7 days vertical list -->
        </div>
      </div>
    </div>

    <!-- Settings Bottom Sheet -->
    <div id="sheet-settings" class="bottom-sheet-overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="bottom-sheet">
        <div class="sheet-header">
          <h3 id="settings-title" class="sheet-title">Settings</h3>
          <button id="btn-close-settings" class="btn-action-text">✕</button>
        </div>

        <div class="settings-section">
          <div class="settings-row">
            <span>Theme</span>
            <select id="select-theme" style="color: var(--text); padding: 4px 8px; border: 1px solid var(--line-hairline); border-radius: var(--radius-sm); background: var(--bg);">
              <option value="auto">Auto</option>
              <option value="dark">Dark</option>
              <option value="light">Light</option>
            </select>
          </div>

          <div class="settings-row">
            <span>Units</span>
            <span style="color: var(--text-muted); font-weight: 600;">Kilograms (kg)</span>
          </div>

          <div class="settings-row">
            <span>Last Backup</span>
            <span id="label-last-backup" style="color: var(--text-muted); font-size: 13px;">Never</span>
          </div>

          <div style="display: flex; gap: var(--space-2); margin-top: var(--space-2);">
            <button id="btn-export-backup" class="btn-action-text" style="flex: 1;">Export Data</button>
            <label class="btn-action-text" style="flex: 1; text-align: center; cursor: pointer;">
              Import Data
              <input type="file" id="input-import-file" accept=".json" style="display: none;">
            </label>
          </div>

          <div style="margin-top: var(--space-3);">
            <button id="btn-reset-all-templates" class="btn-action-text" style="width: 100%;">Reset All Templates</button>
          </div>

          <div style="margin-top: var(--space-4);">
            <button id="btn-delete-all-data" class="btn-danger-outline" style="width: 100%;">Delete All Data</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast Notification (with Undo) -->
    <div id="toast-bar" class="toast-bar" role="status" aria-live="polite">
      <span id="toast-message" class="toast-text"></span>
      <button id="btn-toast-undo" class="btn-toast-undo">Undo</button>
    </div>

  </div>

  <!-- Scripts: plan.js, storage.js, app.js -->
  <script src="./data/plan.js"></script>
  <script src="./storage.js"></script>
  <script src="./app.js"></script>
</body>
</html>
