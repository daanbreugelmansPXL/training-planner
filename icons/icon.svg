<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2430"/>
      <stop offset="100%" stop-color="#0e1117"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect width="508" height="508" x="2" y="2" rx="106" fill="none" stroke="#2a3243" stroke-width="4"/>
  <!-- Bold Lightning Bolt -->
  <path d="M 285 70 L 165 265 L 255 265 L 220 442 L 360 230 L 270 230 Z" 
        fill="url(#bolt)" 
        filter="url(#glow)" 
        stroke="#ffffff" 
        stroke-width="4" 
        stroke-linejoin="round"
        stroke-linecap="round"/>
</svg>
